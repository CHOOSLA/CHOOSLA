<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 293.3 330" width="293.3" height="330" role="img" aria-label="Toolbox, front. Frontend: TypeScript, React, Next.js, Vue. State and mock: TanStack Query, Zustand, MSW.">
<style>@font-face{font-family:JB;src:url(data:font/woff2;base64,) format('woff2')}.u8{font-family:U8,sans-serif;font-weight:800}.u6{font-family:U6,sans-serif;font-weight:600}.jb{font-family:JB,monospace;font-weight:500;letter-spacing:.16em}.k5{font-family:K5,'Noto Sans KR','Malgun Gothic',sans-serif;font-weight:500}.k7{font-family:K7,'Noto Sans KR','Malgun Gothic',sans-serif;font-weight:700}.tw{transform-box:fill-box;transform-origin:center;animation:tw 3s cubic-bezier(.37,0,.63,1) infinite alternate}.t2{animation-delay:-1.4s}@keyframes tw{from{opacity:.55;transform:scale(.72) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(0deg)}}
.fc path{fill:var(--c);stroke:#001E4F;stroke-opacity:.28;stroke-width:.8;stroke-linejoin:round;animation:fx 6s linear infinite}@keyframes fx{0%,62%,100%{fill:var(--c)}20%{fill:#7CBBFF}34%{fill:#FEFFFF}48%{fill:#3AAEFC}}
.e{transform-origin:229px 205px;animation:fan 3s cubic-bezier(.37,0,.63,1) infinite alternate}@keyframes fan{from{transform:rotate(calc(var(--k)*-2.1deg)) scale(calc(1 + var(--k)*.034))}to{transform:rotate(calc(var(--k)*2.1deg)) scale(calc(1 + var(--k)*.034))}}
.d{transform-box:fill-box;transform-origin:center;animation:ht 1.5s cubic-bezier(.37,0,.63,1) infinite alternate}@keyframes ht{from{transform:scale(.34);fill:var(--d0)}to{transform:scale(1.08);fill:var(--d1)}}
.hl{animation:hl 3s cubic-bezier(.37,0,.63,1) infinite alternate}@keyframes hl{from{transform:translate(-4px,7px)}to{transform:translate(3px,-6px)}}
.bob{animation:bob 3s cubic-bezier(.37,0,.63,1) infinite alternate}@keyframes bob{from{transform:translateY(3px)}to{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){*{animation-play-state:paused!important}}</style>
<defs><clipPath id="card"><rect x="8" y="8" width="277.3" height="314" rx="22"/></clipPath></defs>
